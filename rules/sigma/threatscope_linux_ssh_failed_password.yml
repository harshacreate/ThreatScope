title: ThreatScope Linux SSH Failed Password
id: b3f567b6-e30b-5d2a-8156-6d096330195e
name: threatscope_linux_ssh_failed_password
status: test
description: Matches one SSH authentication failure. Use the companion correlation rule for burst detection.
author: harshacreate
date: 2026/11/11
logsource:
  product: linux
  service: sshd
detection:
  selection:
    Message|contains: Failed password
  condition: selection
fields:
  - SourceIp
  - TargetUserName
falsepositives:
  - Mistyped passwords
level: low
tags:
  - attack.t1110
---
title: ThreatScope Linux SSH Brute Force
id: bb2a6109-6d00-52ca-b8ac-306f15df96bc
name: threatscope_linux_ssh_brute_force
status: test
description: Aggregates eight or more SSH failure events from one source in a two-minute Sigma timespan.
author: harshacreate
date: 2026/11/11
correlation:
  type: event_count
  rules:
    - threatscope_linux_ssh_failed_password
  group-by:
    - SourceIp
  timespan: 2m
  condition:
    gte: 8
  generate: true
level: high
tags:
  - attack.t1110
